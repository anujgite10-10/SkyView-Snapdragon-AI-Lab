name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: skyview_flutter_app/skyview_flutter
        run: flutter pub get

      - name: Build Release APK
        working-directory: skyview_flutter_app/skyview_flutter
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyView-AI-Mobile-App
          path: skyview_flutter_app/skyview_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: SkyView AI Mobile App v1.0.0 (Snapdragon® AI Lab)
          body: |
            ## 🌾 SkyView AI — Mobile App (Android APK)
            Automated production build for the **Snapdragon® AI Lab Build & Present Challenge**.

            ### 📱 Direct Download:
            Download **`app-release.apk`** below to install directly on any Android smartphone.

            ### ✨ Key Features:
            - Multilingual Farm Advisory (Hindi, Marathi, Tamil, Telugu, Punjabi, Bengali, English)
            - Live Weather Station Telemetry & Alerts
            - Real-Time Mandi Commodity Tracker (data.gov.in)
            - Voice-first field controls
          files: skyview_flutter_app/skyview_flutter/build/app/outputs/flutter-apk/app-release.apk
